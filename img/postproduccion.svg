<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="suiteBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#14141e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#suiteBg)"/>

  <!-- Luz ambiental suave detrás de monitores -->
  <circle cx="300" cy="180" r="140" fill="#2979ff" opacity="0.15"/>

  <!-- Mesa de edición -->
  <polygon points="40,320 560,320 600,400 0,400" fill="#1b1b24"/>
  <rect x="0" y="320" width="600" height="8" fill="#e5a93b"/>

  <!-- Monitor Central Principal (Color Grading) -->
  <rect x="180" y="70" width="240" height="150" rx="4" fill="#000000" stroke="#333" stroke-width="4"/>
  <rect x="190" y="80" width="220" height="130" fill="#0c1824"/>
  <!-- Imagen en pantalla (onda de color + fotograma) -->
  <polygon points="190,160 230,130 270,150 330,110 370,140 410,120 410,210 190,210" fill="#1976d2" opacity="0.4"/>
  <path d="M190,160 Q250,120 300,160 T410,120" stroke="#00e5ff" stroke-width="2" fill="none"/>
  <!-- Soporte monitor -->
  <rect x="290" y="220" width="20" height="45" fill="#2a2a35"/>
  <rect x="260" y="265" width="80" height="10" rx="3" fill="#3a3a45"/>

  <!-- Monitor Izquierdo (Timeline de edición) -->
  <rect x="30" y="100" width="130" height="110" rx="4" fill="#000000" stroke="#333" stroke-width="3"/>
  <rect x="36" y="106" width="118" height="98" fill="#11161d"/>
  <!-- Pistas de audio y vídeo -->
  <rect x="40" y="115" width="110" height="12" fill="#1565c0" rx="2"/>
  <rect x="40" y="132" width="110" height="12" fill="#2e7d32" rx="2"/>
  <rect x="40" y="149" width="110" height="12" fill="#ef6c00" rx="2"/>
  <rect x="40" y="166" width="110" height="12" fill="#00838f" rx="2"/>
  <!-- Soporte -->
  <rect x="85" y="210" width="15" height="40" fill="#2a2a35"/>
  <rect x="70" y="250" width="45" height="8" rx="2" fill="#3a3a45"/>

  <!-- Monitor Derecho (Formas de onda y scopes) -->
  <rect x="440" y="100" width="130" height="110" rx="4" fill="#000000" stroke="#333" stroke-width="3"/>
  <rect x="446" y="106" width="118" height="98" fill="#0a0f14"/>
  <circle cx="505" cy="155" r="35" fill="none" stroke="#e5a93b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="505" cy="155" r="18" fill="none" stroke="#00e5ff" stroke-width="1"/>
  <!-- Soporte -->
  <rect x="500" y="210" width="15" height="40" fill="#2a2a35"/>
  <rect x="485" y="250" width="45" height="8" rx="2" fill="#3a3a45"/>

  <!-- Superficie de control de etalonaje (DaVinci Wheels) sobre la mesa -->
  <rect x="180" y="335" width="240" height="50" rx="4" fill="#242430" stroke="#444"/>
  <circle cx="220" cy="360" r="15" fill="#15151e" stroke="#e5a93b" stroke-width="1.5"/>
  <circle cx="300" cy="360" r="15" fill="#15151e" stroke="#e5a93b" stroke-width="1.5"/>
  <circle cx="380" cy="360" r="15" fill="#15151e" stroke="#e5a93b" stroke-width="1.5"/>

  <!-- Altavoces monitores de estudio laterales -->
  <rect x="145" y="140" width="25" height="45" rx="3" fill="#1c1c22" stroke="#444"/>
  <circle cx="157" cy="155" r="6" fill="#e5a93b"/>
  <circle cx="157" cy="172" r="8" fill="#333"/>
  <rect x="430" y="140" width="25" height="45" rx="3" fill="#1c1c22" stroke="#444"/>
  <circle cx="442" cy="155" r="6" fill="#e5a93b"/>
  <circle cx="442" cy="172" r="8" fill="#333"/>
</svg>
