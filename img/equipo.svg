<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="eqBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#1e2733"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#eqBg)"/>

  <!-- Silueta de plató de fondo con focos -->
  <circle cx="150" cy="80" r="100" fill="#ffd700" opacity="0.08"/>
  <circle cx="450" cy="80" r="100" fill="#38ef7d" opacity="0.08"/>

  <!-- Suelo de rodaje con cables marcados -->
  <line x1="0" y1="340" x2="600" y2="340" stroke="#334455" stroke-width="2"/>
  <path d="M50,340 Q200,360 380,340 T600,350" fill="none" stroke="#e5a93b" stroke-width="3" opacity="0.6"/>

  <!-- Silla de Director plegable (Izquierda) -->
  <g transform="translate(100, 210)">
    <line x1="20" y1="50" x2="65" y2="130" stroke="#e5a93b" stroke-width="4"/>
    <line x1="65" y1="50" x2="20" y2="130" stroke="#e5a93b" stroke-width="4"/>
    <rect x="15" y="45" width="55" height="10" fill="#111" rx="2"/>
    <line x1="20" y1="10" x2="20" y2="50" stroke="#888" stroke-width="3"/>
    <line x1="65" y1="10" x2="65" y2="50" stroke="#888" stroke-width="3"/>
    <rect x="15" y="10" width="55" height="25" fill="#991b1b" rx="2"/>
    <text x="42" y="26" font-family="'Arial', sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">DIRECTOR</text>
  </g>

  <!-- Pértiga de sonido (Micro Boom) -->
  <g transform="translate(380, 100)">
    <line x1="0" y1="240" x2="-140" y2="20" stroke="#888" stroke-width="3"/>
    <!-- Micrófono zeppelin antiviento -->
    <rect x="-170" y="10" width="45" height="18" rx="9" fill="#333" stroke="#ffd700" stroke-width="1.5"/>
  </g>

  <!-- Siluetas de los tres integrantes de equipo de producción -->
  <!-- Operador Sonido -->
  <g transform="translate(350, 180)">
    <circle cx="30" cy="25" r="16" fill="#ccd6dd"/>
    <!-- Auriculares -->
    <path d="M12,25 C12,10 48,10 48,25" fill="none" stroke="#e5a93b" stroke-width="4"/>
    <rect x="10" y="20" width="6" height="12" rx="2" fill="#e5a93b"/>
    <rect x="44" y="20" width="6" height="12" rx="2" fill="#e5a93b"/>
    <path d="M14,45 C14,40 46,40 46,45 L50,150 L10,150 Z" fill="#2c3e50"/>
  </g>

  <!-- Directora de fotografía / Dirección -->
  <g transform="translate(220, 160)">
    <circle cx="30" cy="25" r="17" fill="#ffe0b2"/>
    <path d="M10,48 C10,42 50,42 50,48 L55,170 L5,170 Z" fill="#b71c1c"/>
    <!-- Claqueta en mano -->
    <rect x="-20" y="80" width="35" height="25" fill="#111" stroke="#e5a93b" stroke-width="1.5"/>
    <polygon points="-20,80 -10,70 15,70 5,80" fill="#e5a93b"/>
  </g>

  <!-- Operador de Cámara -->
  <g transform="translate(140, 175)">
    <circle cx="30" cy="25" r="16" fill="#cfd8dc"/>
    <path d="M12,46 C12,40 48,40 48,46 L52,155 L8,155 Z" fill="#263238"/>
  </g>

  <text x="300" y="380" font-family="'Georgia', serif" font-size="16" fill="#e5a93b" text-anchor="middle" letter-spacing="3">
    TALENTO HUMANO Y PASIÓN POR EL CINE
  </text>
</svg>
