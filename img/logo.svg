<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#e5a93b"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <!-- Icono Claqueta -->
  <g transform="translate(10, 10)">
    <!-- Base de la claqueta -->
    <rect x="0" y="24" width="56" height="38" rx="4" fill="#1e1e1e" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="28" cy="43" r="10" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <polygon points="25,38 34,43 25,48" fill="url(#goldGrad)"/>
    <!-- Brazo oscilante claqueta con franjas -->
    <g transform="rotate(-12 0 20)">
      <rect x="0" y="10" width="56" height="14" rx="2" fill="#1e1e1e" stroke="url(#goldGrad)" stroke-width="2"/>
      <polygon points="10,10 16,10 8,24 2,24" fill="url(#goldGrad)"/>
      <polygon points="24,10 30,10 22,24 16,24" fill="url(#goldGrad)"/>
      <polygon points="38,10 44,10 36,24 30,24" fill="url(#goldGrad)"/>
      <polygon points="52,10 56,10 50,24 44,24" fill="url(#goldGrad)"/>
    </g>
  </g>
  <!-- Texto del Logotipo -->
  <text x="80" y="38" font-family="'Georgia', 'Times New Roman', serif" font-size="24" font-weight="bold" letter-spacing="3" fill="#ffffff">
    LÚMEN
  </text>
  <text x="80" y="58" font-family="'Arial', 'Helvetica', sans-serif" font-size="11" font-weight="600" letter-spacing="5" fill="url(#goldGrad)">
    STUDIOS CINEMATOGRÁFICOS
  </text>
</svg>
