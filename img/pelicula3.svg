<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142116"/>
      <stop offset="60%" stop-color="#243b27"/>
      <stop offset="100%" stop-color="#0a120b"/>
    </linearGradient>
  </defs>
  <rect width="300" height="420" rx="6" fill="url(#p3Grad)"/>

  <!-- Sol poniente entre montañas -->
  <circle cx="150" cy="180" r="50" fill="#fbc02d" opacity="0.6"/>

  <!-- Capas de montañas -->
  <polygon points="-20,270 90,160 210,270" fill="#1b2e1e" opacity="0.8"/>
  <polygon points="100,270 200,140 320,270" fill="#152618" opacity="0.9"/>
  <polygon points="-10,300 130,190 280,300" fill="#0f1d12"/>
  <polygon points="120,300 240,180 340,300" fill="#09130b"/>

  <!-- Silueta de árboles -->
  <g fill="#050a06" opacity="0.95">
    <polygon points="40,300 45,260 50,300"/>
    <polygon points="65,305 72,250 79,305"/>
    <polygon points="90,300 95,265 100,300"/>
    <polygon points="210,302 216,252 222,302"/>
    <polygon points="240,305 247,260 254,305"/>
  </g>

  <!-- Laurel / Premio -->
  <text x="150" y="325" font-family="'Arial', sans-serif" font-size="10" fill="#ffd700" text-anchor="middle" letter-spacing="2">
    ★ PREMIO MEJOR DOCUMENTAL - NATURA FILM FEST ★
  </text>

  <!-- Título -->
  <text x="150" y="358" font-family="'Georgia', serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    RAÍCES DE CRISTAL
  </text>
  <text x="150" y="380" font-family="'Arial', sans-serif" font-size="11" fill="#81c784" text-anchor="middle" letter-spacing="2">
    DOCUMENTAL DE NATURALEZA Y ETNOGRAFÍA
  </text>
  <text x="150" y="400" font-family="'Arial', sans-serif" font-size="9" fill="#aaaaaa" text-anchor="middle">
    RODADO ÍNTEGRAMENTE EN 8K • 92 MINUTOS
  </text>
</svg>
