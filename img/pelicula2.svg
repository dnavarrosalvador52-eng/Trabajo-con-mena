<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c0707"/>
      <stop offset="50%" stop-color="#3b0f0f"/>
      <stop offset="100%" stop-color="#080202"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="300" height="420" rx="6" fill="url(#p2Grad)"/>

  <!-- Luna llena tenue -->
  <circle cx="210" cy="90" r="35" fill="#f5f5f5" opacity="0.3"/>

  <!-- Mar tormentoso -->
  <path d="M0,280 Q75,260 150,280 T300,280 L300,420 L0,420 Z" fill="#0d0404"/>
  <path d="M0,295 Q60,280 140,295 T300,295 L300,420 L0,420 Z" fill="#050101"/>

  <!-- Acantilado -->
  <polygon points="20,290 80,180 110,420 0,420" fill="#150a0a"/>

  <!-- Faro -->
  <polygon points="65,180 75,180 73,110 67,110" fill="#e0e0e0"/>
  <!-- Linterna del faro -->
  <rect x="65" y="102" width="10" height="8" fill="#ffd54f"/>
  <polygon points="63,102 77,102 70,95" fill="#333"/>

  <!-- Haz de luz del faro -->
  <polygon points="75,106 300,60 300,160" fill="url(#beamGrad)" opacity="0.55"/>

  <!-- Laurel / Premio -->
  <text x="150" y="325" font-family="'Arial', sans-serif" font-size="10" fill="#ffd700" text-anchor="middle" letter-spacing="2">
    ★ SELECCIÓN OFICIAL - FESTIVAL DE SAN SEBASTIÁN ★
  </text>

  <!-- Título -->
  <text x="150" y="358" font-family="'Georgia', serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    LA SOMBRA DEL FARERO
  </text>
  <text x="150" y="380" font-family="'Arial', sans-serif" font-size="11" fill="#e57373" text-anchor="middle" letter-spacing="2">
    THRILLER PSICOLÓGICO
  </text>
  <text x="150" y="400" font-family="'Arial', sans-serif" font-size="9" fill="#aaaaaa" text-anchor="middle">
    DIRIGIDA POR SOFÍA HERRERA • 108 MINUTOS
  </text>
</svg>
