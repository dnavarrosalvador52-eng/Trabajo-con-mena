<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051026"/>
      <stop offset="60%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#020813"/>
    </linearGradient>
    <radialGradient id="planetGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#11998e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="420" rx="6" fill="url(#p1Grad)"/>
  
  <!-- Estrellas / Espacio -->
  <circle cx="50" cy="80" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="220" cy="50" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="260" cy="120" r="2" fill="#ffd700" opacity="0.9"/>
  <circle cx="80" cy="180" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="170" cy="90" r="1" fill="#ffffff" opacity="0.7"/>

  <!-- Planeta / Efecto luminoso -->
  <circle cx="150" cy="160" r="90" fill="url(#planetGlow)"/>
  <circle cx="150" cy="160" r="60" fill="#061826" stroke="#38ef7d" stroke-width="2"/>
  <!-- Anillo planetario -->
  <ellipse cx="150" cy="160" rx="100" ry="25" fill="none" stroke="#e5a93b" stroke-width="3" transform="rotate(-20 150 160)"/>

  <!-- Silueta astronauta / personaje -->
  <path d="M142,270 C142,255 158,255 158,270 L155,295 L145,295 Z" fill="#ffffff"/>
  <circle cx="150" cy="250" r="7" fill="#ffffff"/>

  <!-- Laurel de premio -->
  <text x="150" y="325" font-family="'Arial', sans-serif" font-size="10" fill="#ffd700" text-anchor="middle" letter-spacing="2">
    ★ MEJOR FOTOGRAFÍA - FESTIVAL INTERNACIONAL ★
  </text>

  <!-- Título -->
  <text x="150" y="360" font-family="'Georgia', serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    ECOS DEL SILENCIO
  </text>
  <text x="150" y="380" font-family="'Arial', sans-serif" font-size="11" fill="#38ef7d" text-anchor="middle" letter-spacing="2">
    UNA PELÍCULA DE CIENCIA FICCIÓN
  </text>
  <text x="150" y="400" font-family="'Arial', sans-serif" font-size="9" fill="#aaaaaa" text-anchor="middle">
    ESTRENO 2025 • PRODUCCIÓN LÚMEN STUDIOS
  </text>
</svg>
