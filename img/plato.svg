<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#1f1f27"/>
    </linearGradient>
    <linearGradient id="chromaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00aa33"/>
      <stop offset="50%" stop-color="#00d843"/>
      <stop offset="100%" stop-color="#008828"/>
    </linearGradient>
  </defs>
  <!-- Paredes del plató -->
  <rect width="600" height="400" fill="url(#wallGrad)"/>
  
  <!-- Suelo cuadriculado / estudio -->
  <polygon points="0,290 600,290 600,400 0,400" fill="#18181f"/>
  <line x1="0" y1="290" x2="600" y2="290" stroke="#2c2c38" stroke-width="2"/>
  <line x1="120" y1="290" x2="50" y2="400" stroke="#252530" stroke-width="1.5"/>
  <line x1="240" y1="290" x2="200" y2="400" stroke="#252530" stroke-width="1.5"/>
  <line x1="360" y1="290" x2="380" y2="400" stroke="#252530" stroke-width="1.5"/>
  <line x1="480" y1="290" x2="520" y2="400" stroke="#252530" stroke-width="1.5"/>

  <!-- Ciclorama Croma Verde de 800m2 -->
  <rect x="120" y="70" width="360" height="220" rx="6" fill="url(#chromaGrad)" stroke="#005515" stroke-width="3"/>
  <text x="300" y="180" font-family="'Arial', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" opacity="0.6" text-anchor="middle" letter-spacing="4">
    PLATÓ 1 • CICLORAMA INFINITO
  </text>

  <!-- Truss superior de iluminación -->
  <rect x="40" y="20" width="520" height="15" fill="#33333e"/>
  <g stroke="#555" stroke-width="1.5">
    <line x1="40" y1="20" x2="560" y2="35"/>
    <line x1="40" y1="35" x2="560" y2="20"/>
  </g>

  <!-- Focos colgantes -->
  <g transform="translate(180, 35)">
    <line x1="0" y1="0" x2="0" y2="25" stroke="#777" stroke-width="2"/>
    <polygon points="-20,25 20,25 28,45 -28,45" fill="#222" stroke="#e5a93b"/>
    <polygon points="-25,45 25,45 70,250 -70,250" fill="#ffd700" opacity="0.12"/>
  </g>
  <g transform="translate(420, 35)">
    <line x1="0" y1="0" x2="0" y2="25" stroke="#777" stroke-width="2"/>
    <polygon points="-20,25 20,25 28,45 -28,45" fill="#222" stroke="#e5a93b"/>
    <polygon points="-25,45 25,45 70,250 -70,250" fill="#ffd700" opacity="0.12"/>
  </g>

  <!-- Cámara de cine en set -->
  <g transform="translate(140, 240)">
    <rect x="-10" y="0" width="50" height="35" rx="3" fill="#111" stroke="#e5a93b"/>
    <polygon points="40,5 65,0 65,35 40,30" fill="#222"/>
    <line x1="15" y1="35" x2="-20" y2="120" stroke="#333" stroke-width="5"/>
    <line x1="15" y1="35" x2="15" y2="120" stroke="#333" stroke-width="5"/>
    <line x1="15" y1="35" x2="50" y2="120" stroke="#333" stroke-width="5"/>
  </g>
</svg>
